name: Build and test SviatFit 1.6.2 home UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch162/**'
      - '.github/workflows/v162-build-test.yml'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        run: |
          mkdir -p v162/buildsrc
          cat v160/source2/part*.txt > v162/SviatFit_v1.6.0_Android_Project.b64
          base64 -d v162/SviatFit_v1.6.0_Android_Project.b64 > v162/SviatFit_v1.6.0_Android_Project.zip
          unzip -q v162/SviatFit_v1.6.0_Android_Project.zip -d v162/buildsrc
          cd v162/buildsrc/SviatFit-v1.6.0
          sed -i 's/\r$//' app/src/main/assets/index.html
          patch -p1 < "$GITHUB_WORKSPACE/patch161/workout-ui.patch"
          sed -i 's/margin:0 -12px 8px;padding:12px 14px 10px;/margin:0 -12px 8px;padding:calc(34px + env(safe-area-inset-top)) 14px 10px;/' app/src/main/assets/index.html
          sed -i 's/max-width:720px;margin:auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));/max-width:720px;margin:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom));/' app/src/main/assets/index.html
          sed -i 's/bottom:calc(76px + env(safe-area-inset-bottom));/bottom:calc(88px + env(safe-area-inset-bottom));/' app/src/main/assets/index.html
          patch -p1 < "$GITHUB_WORKSPACE/patch162/home-ui.patch"
          sed -i -E 's/versionCode [0-9]+/versionCode 11/' app/build.gradle
          sed -i 's/versionName "1.6.0"/versionName "1.6.2"/' app/build.gradle
          grep -q 'versionName "1.6.2"' app/build.gradle
          grep -q '<title>SviatFit 1.6.2</title>' app/src/main/assets/index.html
          grep -q 'template-start' app/src/main/assets/index.html
          grep -q '▶ Почати тренування' app/src/main/assets/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        working-directory: v162/buildsrc/SviatFit-v1.6.0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug

      - name: Verify built APK
        run: |
          APK="v162/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q '<title>SviatFit 1.6.2</title>'
          unzip -p "$APK" assets/index.html | grep -q '▶ Почати тренування'
          cp "$APK" /tmp/SviatFit_v1.6.2_home_optimized.apk
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 home UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            adb install -r "$GITHUB_WORKSPACE/v162/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
            adb shell pm grant com.sviat.fit android.permission.POST_NOTIFICATIONS || true
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c
            adb shell am force-stop com.sviat.fit
            adb shell am start -W -n com.sviat.fit/.MainActivity | tee /tmp/am-start.txt
            sleep 4

            timeout 20s adb shell uiautomator dump /sdcard/dialog.xml >/dev/null || true
            adb pull /sdcard/dialog.xml /tmp/dialog.xml >/dev/null || true
            python3 -c "import re,xml.etree.ElementTree as ET,os; p='/tmp/dialog.xml'; root=ET.parse(p).getroot() if os.path.exists(p) else None; n=next((x for x in root.iter('node') if x.attrib.get('text')=='Wait'),None) if root is not None else None; a=list(map(int,re.findall(r'\\d+',n.attrib['bounds']))) if n is not None else None; print('adb shell input tap %d %d'%((a[0]+a[2])//2,(a[1]+a[3])//2) if a else 'true')" > /tmp/dismiss-dialog.sh
            sh /tmp/dismiss-dialog.sh
            sleep 2

            timeout 20s adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml /tmp/home.xml >/dev/null
            adb exec-out screencap -p > /tmp/home-optimized.png

            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET
            root=ET.parse('/tmp/home.xml').getroot()
            nodes=[n for n in root.iter('node') if 'Почати тренування' in n.attrib.get('text','')]
            assert nodes, 'No full-width start button found'
            dims=[]
            for n in nodes:
                a=list(map(int,re.findall(r'\d+',n.attrib['bounds'])))
                w,h=a[2]-a[0],a[3]-a[1]
                dims.append((w,h,a))
            print('start-button-bounds',dims)
            w,h,a=dims[0]
            assert w >= 300, f'Start button too narrow: {w}px'
            assert h >= 48, f'Start button too short: {h}px'
            x=(a[0]+a[2])//2
            y=(a[1]+a[3])//2
            open('/tmp/start-tap.sh','w').write(f'adb shell input tap {x} {y}\n')
            PY
            sh /tmp/start-tap.sh
            sleep 2

            timeout 20s adb shell uiautomator dump /sdcard/workout.xml >/dev/null
            adb pull /sdcard/workout.xml /tmp/workout.xml >/dev/null
            grep -q 'Full Body A' /tmp/workout.xml
            grep -q 'Далі' /tmp/workout.xml

            adb shell pidof com.sviat.fit | tee /tmp/pid.txt
            adb logcat -d -v threadtime | grep -E 'AndroidRuntime|FATAL EXCEPTION|com.sviat.fit|chromium|WebView' | tail -1200 | tee /tmp/logcat.txt || true
            ! grep -q 'FATAL EXCEPTION' /tmp/logcat.txt
            adb shell dumpsys activity activities | grep -q 'com.sviat.fit/.MainActivity'

      - name: Upload working APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.2-home-optimized-APK
          path: /tmp/SviatFit_v1.6.2_home_optimized.apk
          if-no-files-found: error

      - name: Upload UI QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.2-home-UI-QA
          path: |
            /tmp/home.xml
            /tmp/workout.xml
            /tmp/home-optimized.png
            /tmp/am-start.txt
            /tmp/pid.txt
            /tmp/logcat.txt
            /tmp/apk-sha256.txt
          if-no-files-found: warn

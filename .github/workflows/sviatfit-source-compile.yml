name: SviatFit 1.9.5 APK build and verify
on:
  workflow_dispatch:
jobs:
  compile_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore source, verify checksum (never APK)
        shell: bash
        run: |
          mkdir -p buildsrc
          base64 -d v195/SviatFit_Update_Source.zip.b64 > /tmp/SviatFit_Update_Source.zip
          echo "95cc2f087bc42abc802e7f7017496505cac8c4b5c0093bdfc153d8a2a11a4bf8  /tmp/SviatFit_Update_Source.zip" | sha256sum -c -
          unzip -q /tmp/SviatFit_Update_Source.zip -d buildsrc
          test -f buildsrc/app/src/main/java/com/sviat/fitnext/SecureUpdateManager.java
          test -f buildsrc/app/src/main/java/com/sviat/fitnext/HealthDataBridge.java
      - name: Test JS syntax
        shell: bash
        run: |
          for f in buildsrc/app/src/main/assets/{app.js,activity.js,native-model.js,native-adapter.js,smart-coach.js}; do node --check "$f"; done
      - name: Confirm preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=buildsrc/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "com.sviat.fit.stable"
      - uses: actions/upload-artifact@v4
        with:
          name: SviatFit-1.9.5-installable-debug-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk


name: Build and test SviatFit 1.6.1 UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch161/**'
      - '.github/workflows/v161-build-test.yml'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        run: |
          mkdir -p v161/buildsrc
          cat v160/source2/part*.txt > v161/SviatFit_v1.6.0_Android_Project.b64
          base64 -d v161/SviatFit_v1.6.0_Android_Project.b64 > v161/SviatFit_v1.6.0_Android_Project.zip
          unzip -q v161/SviatFit_v1.6.0_Android_Project.zip -d v161/buildsrc
          cd v161/buildsrc/SviatFit-v1.6.0
          sed -i 's/\r$//' app/src/main/assets/index.html
          patch -p1 < "$GITHUB_WORKSPACE/patch161/workout-ui.patch"
          sed -i -E 's/versionCode [0-9]+/versionCode 10/' app/build.gradle
          sed -i 's/versionName "1.6.0"/versionName "1.6.1"/' app/build.gradle
          grep -q 'versionName "1.6.1"' app/build.gradle
          grep -q '<title>SviatFit 1.6.1</title>' app/src/main/assets/index.html
          grep -q 'workout-actionbar' app/src/main/assets/index.html
          grep -q 'feedback-details' app/src/main/assets/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        working-directory: v161/buildsrc/SviatFit-v1.6.0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug

      - name: Verify built APK
        run: |
          APK="v161/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q '<title>SviatFit 1.6.1</title>'
          unzip -p "$APK" assets/index.html | grep -q 'workout-actionbar'
          cp "$APK" /tmp/SviatFit_v1.6.1_optimized.apk
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 UI flow test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            adb install -r "$GITHUB_WORKSPACE/v161/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
            adb shell pm grant com.sviat.fit android.permission.POST_NOTIFICATIONS || true
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c
            adb shell am force-stop com.sviat.fit
            adb shell am start -W -n com.sviat.fit/.MainActivity | tee /tmp/am-start.txt
            sleep 4

            # Some GitHub Android images occasionally show a Pixel Launcher ANR over the app.
            # Detect and dismiss it from the UI tree before testing SviatFit.
            timeout 20s adb shell uiautomator dump /sdcard/dialog.xml >/dev/null || true
            adb pull /sdcard/dialog.xml /tmp/dialog.xml >/dev/null || true
            python3 -c "import re,xml.etree.ElementTree as ET,os; p='/tmp/dialog.xml'; root=ET.parse(p).getroot() if os.path.exists(p) else None; n=next((x for x in root.iter('node') if x.attrib.get('text')=='Wait'),None) if root is not None else None; a=list(map(int,re.findall(r'\\d+',n.attrib['bounds']))) if n is not None else None; print('adb shell input tap %d %d'%((a[0]+a[2])//2,(a[1]+a[3])//2) if a else 'true')" > /tmp/dismiss-dialog.sh
            sh /tmp/dismiss-dialog.sh
            sleep 2

            timeout 20s adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml /tmp/home.xml >/dev/null
            python3 -c "import re,xml.etree.ElementTree as ET; root=ET.parse('/tmp/home.xml').getroot(); n=next((x for x in root.iter('node') if x.attrib.get('text')=='Почати'),None); assert n is not None,'No Почати node'; a=list(map(int,re.findall(r'\\d+',n.attrib['bounds']))); print('adb shell input tap %d %d'%((a[0]+a[2])//2,(a[1]+a[3])//2))" > /tmp/start-tap.sh
            sh /tmp/start-tap.sh
            sleep 2

            timeout 20s adb shell uiautomator dump /sdcard/workout.xml >/dev/null
            adb pull /sdcard/workout.xml /tmp/workout.xml >/dev/null
            python3 -c "import re,xml.etree.ElementTree as ET; root=ET.parse('/tmp/workout.xml').getroot(); n=next((x for x in root.iter('node') if 'Жим штанги лежачи' in x.attrib.get('text','')),None); assert n is not None,'No bench press node'; a=list(map(int,re.findall(r'\\d+',n.attrib['bounds']))); print('adb shell input tap %d %d'%((a[0]+a[2])//2,(a[1]+a[3])//2))" > /tmp/exercise-tap.sh
            sh /tmp/exercise-tap.sh
            sleep 2

            timeout 20s adb shell uiautomator dump /sdcard/bench.xml >/dev/null
            adb pull /sdcard/bench.xml /tmp/bench.xml >/dev/null
            grep -q 'Жим штанги лежачи' /tmp/bench.xml
            grep -q 'Далі' /tmp/bench.xml
            adb exec-out screencap -p > /tmp/workout-optimized.png

            adb shell pidof com.sviat.fit | tee /tmp/pid.txt
            adb logcat -d -v threadtime | grep -E 'AndroidRuntime|FATAL EXCEPTION|com.sviat.fit|chromium|WebView' | tail -1200 | tee /tmp/logcat.txt || true
            ! grep -q 'FATAL EXCEPTION' /tmp/logcat.txt
            adb shell dumpsys activity activities | grep -q 'com.sviat.fit/.MainActivity'

      - name: Upload working APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.1-optimized-APK
          path: /tmp/SviatFit_v1.6.1_optimized.apk
          if-no-files-found: error

      - name: Upload UI QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.1-UI-QA
          path: |
            /tmp/home.xml
            /tmp/workout.xml
            /tmp/bench.xml
            /tmp/workout-optimized.png
            /tmp/am-start.txt
            /tmp/pid.txt
            /tmp/logcat.txt
            /tmp/apk-sha256.txt
          if-no-files-found: warn

name: Build and test SviatFit 1.6.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'v160/**'
      - '.github/workflows/v160-build-test.yml'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          mkdir -p v160/buildsrc
          cat v160/source2/part*.txt > v160/SviatFit_v1.6.0_Android_Project.b64
          base64 -d v160/SviatFit_v1.6.0_Android_Project.b64 > v160/SviatFit_v1.6.0_Android_Project.zip
          unzip -q v160/SviatFit_v1.6.0_Android_Project.zip -d v160/buildsrc
          test -f v160/buildsrc/SviatFit-v1.6.0/app/build.gradle
          grep -q 'versionName "1.6.0"' v160/buildsrc/SviatFit-v1.6.0/app/build.gradle
          grep -q '<title>SviatFit 1.6.0</title>' v160/buildsrc/SviatFit-v1.6.0/app/src/main/assets/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        working-directory: v160/buildsrc/SviatFit-v1.6.0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug

      - name: Verify built APK
        run: |
          APK="v160/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q '<title>SviatFit 1.6.0</title>'
          cp "$APK" /tmp/SviatFit_v1.6.0.apk
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            APK="$GITHUB_WORKSPACE/v160/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell pm grant com.sviat.fit android.permission.POST_NOTIFICATIONS || true
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c
            adb shell am force-stop com.sviat.fit
            adb shell am start -W -n com.sviat.fit/.MainActivity | tee /tmp/am-start.txt
            sleep 3
            adb exec-out screencap -p > /tmp/sviatfit-3s.png
            sleep 5
            adb exec-out screencap -p > /tmp/sviatfit-8s.png
            adb shell pidof com.sviat.fit | tee /tmp/pid.txt
            adb logcat -d -v threadtime | grep -E 'AndroidRuntime|FATAL EXCEPTION|com.sviat.fit|chromium|WebView' | tail -1000 | tee /tmp/logcat.txt || true
            if grep -q 'FATAL EXCEPTION' /tmp/logcat.txt; then
              echo "SviatFit crashed"
              exit 1
            fi

      - name: Upload working APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.0-working-APK
          path: /tmp/SviatFit_v1.6.0.apk
          if-no-files-found: error

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.0-runtime-diagnostics
          path: |
            /tmp/am-start.txt
            /tmp/pid.txt
            /tmp/logcat.txt
            /tmp/sviatfit-3s.png
            /tmp/sviatfit-8s.png
            /tmp/apk-sha256.txt
          if-no-files-found: warn

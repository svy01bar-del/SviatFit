name: Build SviatFit APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          cat source/parts/part*.txt > source/SviatFit_v1.3_Android_Project.b64
          base64 -d source/SviatFit_v1.3_Android_Project.b64 > source/SviatFit_v1.3_Android_Project.zip
          unzip -q source/SviatFit_v1.3_Android_Project.zip -d buildsrc

      - name: Apply SviatFit 1.4 patch
        run: |
          base64 -d patch14/part01.txt > buildsrc/SviatFit/app/src/main/assets/index.html
          sed -i 's/versionCode 4/versionCode 5/' buildsrc/SviatFit/app/build.gradle
          sed -i 's/versionName "1.3.0"/versionName "1.4.0"/' buildsrc/SviatFit/app/build.gradle
          grep -q '<title>SviatFit 1.4</title>' buildsrc/SviatFit/app/src/main/assets/index.html
          grep -q 'versionCode 5' buildsrc/SviatFit/app/build.gradle
          grep -q 'versionName "1.4.0"' buildsrc/SviatFit/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 3 -type d | head -100
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: buildsrc/SviatFit
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug

      - name: Verify APK contains SviatFit 1.4
        run: |
          unzip -p buildsrc/SviatFit/app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q '<title>SviatFit 1.4</title>'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.4-APK
          path: buildsrc/SviatFit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: SviatFit 1.9.5 permanently signed APK emulator validation
on:
  push:
    branches: [sviatfit-update-foundation]
    paths: [.github/workflows/sviatfit-195-signed-smoke.yml]
  workflow_dispatch:
jobs:
  signed-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed APK integrity and package
        shell: bash
        run: |
          set -eu
          APK=releases/SviatFit_1.9.5_STABLE_signed.apk
          echo '3b7b7dfe1dd1da62e9599809b7dcb48a04c993dd56fe2362389650ce06e694d3  releases/SviatFit_1.9.5_STABLE_signed.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signed-signature.txt
          grep -q 'e9eca7d7196750c442616593b343f427475764cd4dbf25ab6bde11fd23d43570' /tmp/signed-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/signed-badging.txt
          grep -q "name='com.sviat.fit.stable'" /tmp/signed-badging.txt
      - name: Real signed release install, launch, reinstall, relaunch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 540
          script: |
            set -eu
            APK="$GITHUB_WORKSPACE/releases/SviatFit_1.9.5_STABLE_signed.apk"
            adb install "$APK" | tee /tmp/signed-install.txt
            adb shell am start -W -n com.sviat.fit.stable/com.sviat.fitnext.MainActivity | tee /tmp/signed-launch.txt
            sleep 10
            adb shell pidof com.sviat.fit.stable | tee /tmp/signed-pid.txt
            adb exec-out screencap -p > /tmp/signed-boot.png
            adb install -r "$APK" | tee /tmp/signed-reinstall.txt
            adb shell am force-stop com.sviat.fit.stable
            adb shell am start -W -n com.sviat.fit.stable/com.sviat.fitnext.MainActivity | tee /tmp/signed-relaunch.txt
            sleep 7
            adb shell pidof com.sviat.fit.stable | tee /tmp/signed-repid.txt
            adb exec-out screencap -p > /tmp/signed-after-update.png
            adb logcat -d -v brief > /tmp/signed-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com.sviat.fit.stable' /tmp/signed-logcat.txt; then exit 1; fi
      - name: Upload signed APK test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-1.9.5-signed-emulator-test
          path: /tmp/signed-*
          if-no-files-found: warn

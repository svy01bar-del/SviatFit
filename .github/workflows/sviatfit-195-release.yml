name: SviatFit 1.9.5 Stable release build (unsigned artifact)
on:
  push:
    branches: [sviatfit-update-foundation]
    paths: [.github/workflows/sviatfit-195-release.yml]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore verified Android source without private keys
        shell: bash
        run: |
          mkdir -p buildsrc
          base64 -d v195/SviatFit_Update_Source.zip.b64 > /tmp/SviatFit_Update_Source.zip
          echo '95cc2f087bc42abc802e7f7017496505cac8c4b5c0093bdfc153d8a2a11a4bf8  /tmp/SviatFit_Update_Source.zip' | sha256sum -c -
          unzip -q /tmp/SviatFit_Update_Source.zip -d buildsrc
          test -f buildsrc/app/src/main/java/com/sviat/fitnext/HealthDataBridge.java
          test -f buildsrc/app/src/main/java/com/sviat/fitnext/SecureUpdateManager.java
          node --check buildsrc/app/src/main/assets/app.js
      - name: Build release APK (unsigned; sign privately elsewhere)
        working-directory: buildsrc
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon
      - name: Check release artifact and package identity
        shell: bash
        run: |
          set -eu
          APK=buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/sviatfit-release-badging.txt
          grep -q "name='com.sviat.fit.stable'" /tmp/sviatfit-release-badging.txt
          grep -q "versionCode='195'" /tmp/sviatfit-release-badging.txt
          unzip -t "$APK" | tail -3
      - name: Publish unsigned compiled APK and official Android signer
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-1.9.5-unsigned-and-apksigner
          path: |
            buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk
            /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
      - name: Android emulator install and launch debug test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-boot-timeout: 480
          disable-animations: true
          script: |
            set -eu
            adb install -r "$GITHUB_WORKSPACE/buildsrc/app/build/outputs/apk/debug/app-debug.apk" | tee /tmp/sviatfit-install.txt
            adb shell am start -W -n com.sviat.fit.stable/com.sviat.fitnext.MainActivity | tee /tmp/sviatfit-launch.txt
            sleep 7
            adb shell pidof com.sviat.fit.stable | tee /tmp/sviatfit-pid.txt
            adb exec-out screencap -p > /tmp/sviatfit-boot.png
            adb shell am force-stop com.sviat.fit.stable
            adb install -r "$GITHUB_WORKSPACE/buildsrc/app/build/outputs/apk/debug/app-debug.apk" | tee /tmp/sviatfit-upgrade.txt
            adb shell am start -W -n com.sviat.fit.stable/com.sviat.fitnext.MainActivity | tee /tmp/sviatfit-relaunch.txt
            sleep 5
            adb shell pidof com.sviat.fit.stable | tee /tmp/sviatfit-repid.txt
            adb exec-out screencap -p > /tmp/sviatfit-reboot.png
            adb logcat -d -v brief > /tmp/sviatfit-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com.sviat.fit.stable' /tmp/sviatfit-logcat.txt; then exit 1; fi
      - name: Publish emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-1.9.5-android-emulator-report
          path: /tmp/sviatfit-*
          if-no-files-found: warn

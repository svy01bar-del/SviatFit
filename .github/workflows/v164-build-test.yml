name: Build and test SviatFit 1.6.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch164/**'
      - '.github/workflows/v164-build-test.yml'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        run: |
          mkdir -p v164/buildsrc
          cat v160/source2/part*.txt > v164/SviatFit_v1.6.0_Android_Project.b64
          base64 -d v164/SviatFit_v1.6.0_Android_Project.b64 > v164/SviatFit_v1.6.0_Android_Project.zip
          unzip -q v164/SviatFit_v1.6.0_Android_Project.zip -d v164/buildsrc
          cd v164/buildsrc/SviatFit-v1.6.0
          sed -i 's/\r$//' app/src/main/assets/index.html

          patch -p1 < "$GITHUB_WORKSPACE/patch161/workout-ui.patch"
          sed -i 's/margin:0 -12px 8px;padding:12px 14px 10px;/margin:0 -12px 8px;padding:calc(34px + env(safe-area-inset-top)) 14px 10px;/' app/src/main/assets/index.html
          sed -i 's/max-width:720px;margin:auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));/max-width:720px;margin:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom));/' app/src/main/assets/index.html
          sed -i 's/bottom:calc(76px + env(safe-area-inset-bottom));/bottom:calc(88px + env(safe-area-inset-bottom));/' app/src/main/assets/index.html

          python3 "$GITHUB_WORKSPACE/patch162/apply_home_ui.py"
          python3 "$GITHUB_WORKSPACE/patch163/apply_v163.py"
          python3 "$GITHUB_WORKSPACE/patch163/apply_native_startup_qa.py"
          python3 "$GITHUB_WORKSPACE/patch164/apply_v164.py"
          base64 -d "$GITHUB_WORKSPACE/patch164/zma_app.jpg.b64" > app/src/main/assets/zma_app.jpg
          test "$(stat -c%s app/src/main/assets/zma_app.jpg)" -gt 10000
          cp "$GITHUB_WORKSPACE/patch164/SupplementReminderReceiver.java" app/src/main/java/com/sviat/fit/SupplementReminderReceiver.java
          python3 "$GITHUB_WORKSPACE/patch164/apply_native_v164.py"
          python3 "$GITHUB_WORKSPACE/patch164/apply_manifest_v164.py"

          sed -i -E 's/versionCode [0-9]+/versionCode 13/' app/build.gradle
          sed -i 's/versionName "1.6.0"/versionName "1.6.4"/' app/build.gradle

          grep -q 'versionName "1.6.4"' app/build.gradle
          grep -q '<title>SviatFit 1.6.4</title>' app/src/main/assets/index.html
          grep -q 'data-tab="vitamins"' app/src/main/assets/index.html
          grep -q 'VPLab' app/src/main/assets/index.html
          grep -q 'scheduleSupplementReminder' app/src/main/java/com/sviat/fit/MainActivity.java
          grep -q 'SupplementReminderReceiver' app/src/main/AndroidManifest.xml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        working-directory: v164/buildsrc/SviatFit-v1.6.0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --console=plain

      - name: Verify APK archive
        run: |
          APK="v164/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html | grep -q '<title>SviatFit 1.6.4</title>'
          unzip -p "$APK" assets/index.html | grep -q 'data-tab="vitamins"'
          unzip -l "$APK" assets/zma_app.jpg | grep -q 'zma_app.jpg'
          cp "$APK" /tmp/SviatFit_v1.6.4_ZMA.apk
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 emulator QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            adb install -r "$GITHUB_WORKSPACE/v164/buildsrc/SviatFit-v1.6.0/app/build/outputs/apk/debug/app-debug.apk"
            adb shell pm grant com.sviat.fit android.permission.POST_NOTIFICATIONS || true
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c

            adb shell am force-stop com.sviat.fit
            adb shell am start -W -n com.sviat.fit/.MainActivity --es sviat_qa_action full_flow | tee /tmp/am-full.txt
            timeout 40s sh -c 'until adb logcat -d -v brief | grep -q "SviatQA.*FLOW_DONE="; do sleep 1; done'

            adb shell am force-stop com.sviat.fit
            adb shell am start -W -n com.sviat.fit/.MainActivity --es sviat_qa_action vitamins_flow | tee /tmp/am-vitamins.txt
            timeout 40s sh -c 'until adb logcat -d -v brief | grep -q "SviatQA.*VITAMINS="; do sleep 1; done'

            adb exec-out screencap -p > /tmp/sviatfit-vitamins.png
            adb shell pidof com.sviat.fit | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb shell dumpsys activity activities | grep -q 'com.sviat.fit/.MainActivity'

            adb logcat -d -v threadtime > /tmp/logcat-full.txt
            grep 'SviatQA' /tmp/logcat-full.txt | tee /tmp/qa-flow.txt
            grep -q 'FLOW_DONE=' /tmp/qa-flow.txt
            grep -q 'VITAMINS=' /tmp/qa-flow.txt
            grep -q 'REMINDER_SCHEDULED=ZMA' /tmp/qa-flow.txt
            grep -q 'take_w=' /tmp/qa-flow.txt
            ! grep -q 'FATAL EXCEPTION' /tmp/logcat-full.txt
            test "$(stat -c%s /tmp/sviatfit-vitamins.png)" -gt 20000
            adb shell dumpsys alarm | grep -q 'com.sviat.fit'

      - name: Upload working APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.4-ZMA-working-APK
          path: /tmp/SviatFit_v1.6.4_ZMA.apk
          if-no-files-found: error

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-v1.6.4-Android-QA
          path: |
            /tmp/am-full.txt
            /tmp/am-vitamins.txt
            /tmp/sviatfit-vitamins.png
            /tmp/pid.txt
            /tmp/qa-flow.txt
            /tmp/logcat-full.txt
            /tmp/apk-sha256.txt
          if-no-files-found: warn

name: Runtime smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runtime-test.yml'

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        run: |
          mkdir -p buildsrc
          cat source/parts/part*.txt > source/SviatFit_v1.3_Android_Project.b64
          base64 -d source/SviatFit_v1.3_Android_Project.b64 > source/SviatFit_v1.3_Android_Project.zip
          unzip -q source/SviatFit_v1.3_Android_Project.zip -d buildsrc
          base64 -d patch14/part01.txt > buildsrc/SviatFit/app/src/main/assets/index.html
          sed -i 's/versionCode 4/versionCode 6/' buildsrc/SviatFit/app/build.gradle
          sed -i 's/versionName "1.3.0"/versionName "1.4.2"/' buildsrc/SviatFit/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p=Path("buildsrc/SviatFit/app/src/main/java/com/sviat/fit/MainActivity.java")
          x=p.read_text()
          x=x.replace("import android.graphics.Color;","import android.graphics.Color;\nimport android.graphics.Bitmap;\nimport android.util.Log;")
          x=x.replace("import android.webkit.WebViewClient;","import android.webkit.WebViewClient;\nimport android.webkit.WebResourceError;\nimport android.webkit.WebResourceRequest;\nimport android.webkit.ConsoleMessage;")
          x=x.replace(
              "        webView.setWebViewClient(new WebViewClient());",
              """        WebView.setWebContentsDebuggingEnabled(true);
        webView.setWebViewClient(new WebViewClient() {
            @Override public void onPageStarted(WebView view, String url, Bitmap favicon) {
                Log.i("SviatFitWeb", "PAGE_STARTED " + url);
            }
            @Override public void onPageFinished(WebView view, String url) {
                Log.i("SviatFitWeb", "PAGE_FINISHED " + url);
                view.evaluateJavascript("(function(){return document.body ? document.body.innerText.substring(0,500) : 'NO_BODY';})()", value -> Log.i("SviatFitWeb", "BODY=" + value));
            }
            @Override public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                Log.e("SviatFitWeb", "ERROR " + error.getErrorCode() + " " + error.getDescription() + " url=" + request.getUrl());
            }
        });"""
          )
          needle="""            @Override
            public boolean onShowFileChooser(WebView view,"""
          repl="""            @Override
            public boolean onConsoleMessage(ConsoleMessage cm) {
                Log.i("SviatFitConsole", cm.message() + " @" + cm.lineNumber() + " " + cm.sourceId());
                return true;
            }

            @Override
            public boolean onShowFileChooser(WebView view,"""
          x=x.replace(needle,repl)
          p.write_text(x)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate sdkmanager and install SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        working-directory: buildsrc/SviatFit
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            adb install -r "$GITHUB_WORKSPACE/buildsrc/SviatFit/app/build/outputs/apk/debug/app-debug.apk"
            adb shell pm grant com.sviat.fit android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am force-stop com.sviat.fit
            adb shell am start -W -n com.sviat.fit/.MainActivity | tee /tmp/am-start.txt

            sleep 5
            adb exec-out screencap -p > /tmp/sviatfit-5s.png

            sleep 10
            adb exec-out screencap -p > /tmp/sviatfit-15s.png

            sleep 15
            adb exec-out screencap -p > /tmp/sviatfit-30s.png

            adb shell pidof com.sviat.fit | tee /tmp/pid.txt || true
            adb shell dumpsys activity activities | grep -A 5 -B 2 'com.sviat.fit' | tee /tmp/activity.txt || true
            timeout 15s adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml /tmp/window.xml || true
            adb logcat -d -v threadtime | grep -E 'AndroidRuntime|FATAL EXCEPTION|com.sviat.fit|chromium|WebView|Console|SviatFitWeb|SviatFitConsole' | tail -1200 | tee /tmp/logcat.txt || true
            adb shell pidof com.sviat.fit >/dev/null

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SviatFit-runtime-diagnostics-30s
          path: |
            /tmp/am-start.txt
            /tmp/pid.txt
            /tmp/activity.txt
            /tmp/logcat.txt
            /tmp/window.xml
            /tmp/sviatfit-5s.png
            /tmp/sviatfit-15s.png
            /tmp/sviatfit-30s.png
          if-no-files-found: warn

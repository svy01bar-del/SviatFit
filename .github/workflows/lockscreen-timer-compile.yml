name: SviatFit lockscreen timer - compile Java only (no APK)
on:
  push:
    branches: [sviatfit-lockscreen-timer]
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct source patch
        run: |
          mkdir -p buildsrc
          base64 -d v197/SviatFit_LockScreen_Timer_Source_Update.zip.b64 > /tmp/source.zip
          echo "53405f5439a17b618ce7168ffc1ca9d60d422aaede4b2e5944e50f99ded97de0  /tmp/source.zip" | sha256sum -c -
          unzip -q /tmp/source.zip -d buildsrc
          test -s buildsrc/app/src/main/assets/sviatfit_countdown_5_4_3_2_1_LOS.gif
          grep -q 'class RestTimerService' buildsrc/app/src/main/java/com/sviat/fitnext/RestTimerService.java
          grep -q 'class RestCountdownActivity' buildsrc/app/src/main/java/com/sviat/fitnext/RestCountdownActivity.java
          node --check buildsrc/app/src/main/assets/app.js
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Compile Android code only - do NOT assemble APK
        working-directory: buildsrc
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace

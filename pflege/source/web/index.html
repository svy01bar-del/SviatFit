<script>
(function(){
"use strict";
var DATA=window.PFLEGE_DATA, KEY="sviat-pflege-v1", state, storageOK=true, current={page:"home"}, currentWord=null, flash=null, activeAudio=null, toastTimer, books=[], importing=null;
var defaults={version:1,settings:{theme:"system",font:18,highlights:true,translation:true,rate:.88},done:{},answers:{},first:{},reviews:{},notes:{},customCards:[],dictionary:{}};
function cleanState(raw){var s=JSON.parse(JSON.stringify(defaults));if(!raw||typeof raw!=="object")return s;
["done","answers","first","reviews","notes","dictionary"].forEach(function(k){if(raw[k]&&typeof raw[k]==="object"&&!Array.isArray(raw[k]))s[k]=raw[k];});
if(Array.isArray(raw.customCards))s.customCards=raw.customCards.filter(function(c){return c&&typeof c.de==="string"&&typeof c.ua==="string";}).slice(0,10000);
if(raw.settings&&typeof raw.settings==="object")Object.assign(s.settings,raw.settings);
if(["system","dark","light"].indexOf(s.settings.theme)<0)s.settings.theme="system";
s.settings.font=Math.max(16,Math.min(24,Number(s.settings.font)||18));s.settings.rate=Math.max(.6,Math.min(1.2,Number(s.settings.rate)||.88));return s;}
try{state=cleanState(JSON.parse(localStorage.getItem(KEY)||"null"));}catch(e){state=cleanState(null);storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;toast("Не вдалося зберегти. Експортуй резервну копію.");}}
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function applyTheme(){var theme=state.settings.theme==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):state.settings.theme;document.documentElement.dataset.theme=theme;document.documentElement.style.setProperty("--size",state.settings.font+"px");document.querySelector('meta[name="theme-color"]').content=theme==="dark"?"#0d1222":"#f4f6fc";if(native()&&window.Native.setTheme)window.Native.setTheme(theme);}
function toast(s){clearTimeout(toastTimer);document.getElementById("toast").textContent=s;toastTimer=setTimeout(function(){document.getElementById("toast").textContent="";},4500);}
function native(){return !!window.Native&&typeof window.Native.speak==="function";}
function rich(s,keys){var highlighted={};if(state.settings.highlights)(keys||[]).forEach(function(k){(k.match(/[A-Za-zÄÖÜäöüß]+/g)||[]).filter(function(x){return x.length>3;}).forEach(function(w){highlighted[w.toLowerCase()]=true;});});
return String(s).split(/([A-Za-zÄÖÜäöüß]+)/g).map(function(p){if(!/^[A-Za-zÄÖÜäöüß]+$/.test(p))return h(p);var b='<button type="button" class="word" data-word="'+h(p)+'">'+h(p)+"</button>";return highlighted[p.toLowerCase()]?"<mark>"+b+"</mark>":b;}).join("");}
function de(s,keys){return '<p class="german" lang="de" data-context="'+h(s)+'">'+rich(s,keys)+"</p>";}
function btn(label,action,cls,extra){return '<button type="button" class="btn '+(cls||"")+'" data-action="'+action+'" '+(extra||"")+">"+label+"</button>";}
function moduleById(id){return DATA.modules.find(function(m){return m.id===id;});}
function allCards(){var a=[];DATA.modules.forEach(function(m){m.phrases.forEach(function(p,i){a.push({id:m.id+"-p"+i,module:m.id,de:p[0],ua:p[1],kind:"Фраза",example:m.dialogue[0][1],exampleUA:m.dialogue[0][2]});});m.vocab.forEach(function(v,i){a.push({id:m.id+"-v"+i,module:m.id,de:v[0],ua:v[1],kind:"Слово",example:v[2],exampleUA:v[3]});});});return a.concat(state.customCards);}
function dueCards(filter,star){return allCards().filter(function(c){var r=state.reviews[c.id]||{};return (!filter||c.module===filter)&&(!star||r.favorite)&&(!r.due||r.due<=Date.now());});}
function doneCount(){return DATA.modules.reduce(function(n,m){return n+(state.done[m.id+"-reading"]?1:0)+(state.done[m.id+"-gaps"]?1:0);},0);}
function nextUnit(){for(var i=0;i<DATA.modules.length;i++){var m=DATA.modules[i];if(!state.done[m.id+"-reading"])return {id:m.id,type:"reading"};if(!state.done[m.id+"-gaps"])return {id:m.id,type:"gaps"};}return {id:DATA.modules[0].id,type:"reading"};}
function go(page,id,type){stopSpeech();current={page:page,id:id,type:type};render();window.scrollTo(0,0);}
function navPage(){return current.page==="lesson"||current.page==="matching"||current.page==="ausbildung"||current.page==="exam-menu"||current.page==="exam-case"?"course":current.page==="book"?"materials":current.page;}
function render(){applyTheme();document.querySelectorAll("[data-nav]").forEach(function(b){b.classList.toggle("active",b.dataset.nav===navPage());});var v=document.getElementById("view");
if(current.page==="home")v.innerHTML=home();else if(current.page==="ausbildung")v.innerHTML=ausbildung();else if(current.page==="exam-menu")v.innerHTML=examMenu();else if(current.page==="exam-case")v.innerHTML=examView();else if(current.page==="course")v.innerHTML=course();else if(current.page==="lesson")v.innerHTML=lesson();else if(current.page==="cards")v.innerHTML=cards();else if(current.page==="matching")v.innerHTML=matching();else if(current.page==="materials")v.innerHTML=materials();else if(current.page==="book")v.innerHTML=bookView();else if(current.page==="settings")v.innerHTML=settings();else v.innerHTML=home();
}

function officialLinks(){return DATA.officialResources.map(function(r){return '<div class="source"><a href="'+h(r.url)+'" target="_blank" rel="noopener noreferrer" data-action="open-resource" data-url="'+h(r.url)+'">'+h(r.title)+' ↗</a><p class="muted">'+h(r.detail)+'</p></div>';}).join("");}
function examScore(c){return c.questions.reduce(function(n,q,i){return n+(state.answers["exam-"+c.id+"-"+i]===q[2]?1:0);},0);}
function ausbildung(){return btn("‹ На головну","home","ghost back")+'<div class="eyebrow">Pflegefachassistenz · правила для старту з 2027 року</div><h1>Твоя Ausbildung</h1><p class="muted">Офіційні факти перевірено 21.10.2026. Уроки й план нижче — наша мовна підготовка.</p><div class="stats card"><div class="stat"><strong>18</strong><span>місяців очно</span></div><div class="stat"><strong>1 050</strong><span>годин занять мінімум</span></div><div class="stat"><strong>1 280</strong><span>годин практики мінімум</span></div></div><p class="small muted">Практика охоплює лікарню, стаціонарний та амбулаторний догляд. Рамкова програма BIBB має 202 сторінки; школа готує власні навчальні матеріали.</p><section class="card"><h2>Як проходить державний іспит</h2><div class="exam-fact"><strong>Письмова частина · 2 × 120 хв</strong><p>Дві роботи за ситуаціями догляду. Тренуй розуміння випадку й письмове пояснення дій.</p></div><div class="exam-fact"><strong>Усна частина · 20–30 хв на людину</strong><p>Розбір ситуації та обґрунтування відповіді. Надається час на підготовку.</p></div><div class="exam-fact"><strong>Практична частина · 1–2 людини</strong><p>Підготовка, представлення випадку, догляд за наявним планом і рефлексія. Після підготовки виконувана частина разом із представленням і рефлексією зазвичай до 120 хвилин; представлення й рефлексія — максимум по 20 хвилин у межах цього часу.</p></div><p class="small muted">Потрібно скласти всі три частини. Підстава: PflFAssAPrV §§27, 34, 38–39, 43. Мовний telc Pflege — окремий іспит.</p><div class="row">'+btn("Мова запитань іспиту","unit","",'data-id="pruefungssprache" data-type="reading"')+btn("Три навчальні випадки","exam-menu","primary")+'</div></section><div class="space"></div><h2>9 напрямів офіційної програми</h2><p class="muted small">Кожен напрям веде до пов’язаного уроку нашого курсу. Позначка стосується цього уроку, а не завершення офіційної Ausbildung.</p><div class="grid">'+DATA.curriculum.map(function(c){var done=!!state.done[c[3]+"-reading"];return '<section class="card"><div class="topic"><span class="number">'+c[0]+'</span><div><h3>'+h(c[1])+'</h3><span class="tag">'+(done?"✓ Пов’язаний урок пройдено":"○ Урок ще не пройдено")+'</span></div></div><div class="small">'+de(c[2])+'</div>'+btn("Відкрити урок","unit","wide",'data-id="'+c[3]+'" data-type="reading"')+'</section>';}).join("")+'</div><div class="space"></div><h2>Мій план на 8 тижнів</h2><p class="muted small">Рекомендований порядок для старту з B1. 30–40 хв на день; переходь далі, коли можеш пояснити ситуацію своїми словами.</p><div class="stack">'+DATA.studyPlan.map(function(w,i){var count=w.ids.reduce(function(n,id){return n+(state.done[id+"-reading"]?1:0)+(state.done[id+"-gaps"]?1:0);},0),total=w.ids.length*2;return '<section class="card"><div class="row between"><h3>'+h(w.title)+'</h3><span class="pill">'+count+' / '+total+'</span></div><p class="muted small">'+h(w.task)+'</p><div class="progress"><i style="width:'+(count/total*100)+'%"></i></div><div class="row">'+w.ids.map(function(id){var m=moduleById(id);return btn(h(m.title),"unit","",'data-id="'+id+'" data-type="reading"');}).join("")+'</div></section>';}).join("")+'</div><div class="space"></div><section class="card"><h2>Офіційні матеріали та мовні тести</h2><p class="muted small">Для відкриття зовнішніх сайтів потрібен інтернет. Навчальні тексти, переклади та голос усередині програми працюють офлайн.</p>'+officialLinks()+'</section>';}
function examMenu(){return btn("‹ Програма й план","ausbildung","ghost back")+'<div class="eyebrow">Мовна практика · авторські завдання</div><h1>Тренування іспиту</h1><p class="muted">Це навчальні випадки, створені для нашої програми. Вони тренують мову відповіді й не є офіційними екзаменаційними білетами.</p><div class="stack">'+DATA.examCases.map(function(c,i){var count=examScore(c);return '<section class="card"><div class="topic"><span class="number">0'+(i+1)+'</span><div><h2>'+h(c.title)+'</h2><span class="tag">3 запитання · короткий запис · аудіозразок</span></div></div><div class="progress"><i style="width:'+(count/3*100)+'%"></i></div><div class="row between"><span class="unit-score">'+count+' / 3 правильні</span>'+btn(count===3?"Повторити":"Відкрити випадок","exam-case","primary",'data-id="'+c.id+'"')+'</div></section>';}).join("")+'</div>';}
function examView(){var c=DATA.examCases.find(function(c){return c.id===current.id;});if(!c)return examMenu();return btn("‹ Усі випадки","exam-menu","ghost back")+'<div class="eyebrow">Прочитай · обери · обґрунтуй</div><h1>'+h(c.title)+'</h1><p class="muted small">Авторська мовна вправа. Натискай німецькі слова для перекладу.</p><section class="card"><div class="row between"><h2>Випадок</h2>'+btn("▷ Слухати","exam-speak","",'data-id="'+c.id+'" data-type="text"')+'</div>'+de(c.text,c.keys)+'<details><summary class="accent">Переклад випадку</summary><p class="translation">'+h(c.ua)+'</p></details>'+c.questions.map(function(q,i){var a=state.answers["exam-"+c.id+"-"+i];return '<div class="question"><strong lang="de">'+(i+1)+'. '+h(q[0])+'</strong><div class="space"></div><div class="answers">'+q[1].map(function(o,j){return '<button class="option '+(a===j?(j===q[2]?"correct":"wrong"):"")+'" data-action="exam-answer" data-id="'+c.id+'" data-index="'+i+'" data-option="'+j+'"><span class="letter">'+String.fromCharCode(97+j)+'</span><span lang="de">'+h(o)+'</span></button>';}).join("")+'</div>'+(a===undefined?"":'<div class="feedback '+(a===q[2]?"good":"bad")+'" role="status"><strong>'+(a===q[2]?"✓ Правильно":"Спробуй ще раз")+'</strong><br>'+h(q[3])+'</div>')+'</div>';}).join("")+'<p class="unit-score">'+examScore(c)+' / 3 правильні</p>'+btn("Очистити відповіді","exam-retry","ghost",'data-id="'+c.id+'"')+'</section><div class="space"></div><section class="card"><h2>Скажи й запиши німецькою</h2><p>'+h(c.prompt)+'</p><textarea data-note="exam-'+c.id+'" aria-label="Твоя відповідь на навчальний випадок" placeholder="Напиши 2–3 речення…">'+h(state.notes["exam-"+c.id]||"")+'</textarea><p class="tag">Запис зберігається автоматично. Порівняй самостійно: факт, слова людини, виконана дія. Автоматична оцінка письма не виконується.</p><details><summary class="accent">Порівняти зі зразком</summary>'+de(c.model)+'<p class="translation">'+h(c.modelUA)+'</p>'+btn("▷ Слухати відповідь","exam-speak","primary",'data-id="'+c.id+'" data-type="model"')+'</details></section>';}

function home(){var n=nextUnit(),count=doneCount(),due=dueCards().length,total=DATA.modules.length*2;
return '<div class="eyebrow">Твоя практика починається з розмови</div><div class="hero"><div class="row between"><span class="pill">Оновлення 1.1 · Ausbildung 2027</span><span class="tag">B1 → професійний B2</span></div><div class="space"></div><h1>Німецька для роботи<br>в Altenheim.</h1><p>Розмови з мешканцями, співпраця з колегами та мовна підготовка до Pflegefachassistenz.</p><div class="row">'+btn("Продовжити навчання →","unit","primary",'data-id="'+n.id+'" data-type="'+n.type+'"')+btn("Повторити картки","start-review")+'</div><div class="stats"><div class="stat"><strong>'+count+'<span> / '+total+'</span></strong><span>підпункти пройдено</span></div><div class="stat"><strong>'+due+'</strong><span>карток до повторення</span></div><div class="stat"><strong>'+DATA.modules.length+'</strong><span>практичних тем</span></div></div><div class="progress" role="progressbar" aria-label="Прогрес курсу" aria-valuenow="'+count+'" aria-valuemin="0" aria-valuemax="'+total+'"><i style="width:'+(count/total*100)+'%"></i></div></div>'+
(!storageOK?'<p class="feedback bad">Збереження в браузері недоступне. Зроби резервну копію прогресу.</p>':"")+
'<div class="grid"><section class="card feature"><div class="eyebrow">Твій шлях на 18 місяців</div><h2>Ausbildung 2027</h2><p class="muted small">9 напрямів програми, формат державного іспиту та план мовної підготовки на 8 тижнів.</p>'+btn("Відкрити програму й план","ausbildung","primary wide")+'</section><section class="card"><div class="eyebrow">Зрозуміти → відповісти → пояснити</div><h2>Тренування іспиту</h2><p class="muted small">3 авторські випадки. Вибери відповідь, зрозумій пояснення й прослухай зразок короткого повідомлення.</p>'+btn("Почати тренування","exam-menu","wide")+'</section><section class="card"><div class="eyebrow">План на 30–40 хвилин</div><h2>Невеликий урок щодня</h2><p class="muted small">5 хв — картки · 10 хв — читання · 10 хв — слухання й діалог · 5–15 хв — короткий запис.</p>'+btn("Відкрити всі теми","course","wide")+'</section><section class="card"><div class="eyebrow">Відповіді за номерами</div><h2>13a · 14e · 15X</h2><p class="muted small">Повний текст, усі варіанти та окремий вибір для кожного номера.</p>'+btn("Потренувати відповідність","match-menu","wide")+'</section></div><p class="callout">Нові теми й озвучення доступні офлайн. Програма тренує мову; практичні навички ти опановуєш із наставником.</p>';
}

function course(){return btn("Ausbildung 2027 · програма, іспит і план","ausbildung","wide")+'<div class="space"></div>'+'<div class="eyebrow">B1 → B2 для Pflegefachassistenz</div><h1>Твій навчальний курс</h1><p class="muted">Кожна тема має два підпункти: розуміння ситуації та граматику в суцільному тексті.</p><input id="course-search" type="search" class="search" placeholder="Знайти тему: їжа, колеги, біль…" aria-label="Пошук тем"><div id="course-list" class="grid">'+courseRows("")+'</div><div class="space"></div><div class="card"><h2>Додаткова практика: відповідність</h2><div class="row">'+DATA.matches.map(function(m){return btn(h(m.title),"match","","data-id=\""+m.id+"\"");}).join("")+'</div></div>';}
function courseRows(q){return DATA.modules.filter(function(m){return (m.title+" "+m.deTitle+" "+m.goal).toLowerCase().indexOf(q.toLowerCase())>=0;}).map(function(m){var count=(state.done[m.id+"-reading"]?1:0)+(state.done[m.id+"-gaps"]?1:0);return '<section class="card"><div class="topic"><span class="number">'+String(DATA.modules.indexOf(m)+1).padStart(2,"0")+'</span><div><h2>'+h(m.title)+'</h2><p lang="de">'+h(m.deTitle)+'</p></div></div><p class="muted small">'+h(m.goal)+'</p><div class="variants">'+variant(m,"reading","1. Ситуація й діалог")+variant(m,"gaps","2. Текст із пропусками")+'</div><div class="progress"><i style="width:'+(count*50)+'%"></i></div><span class="tag">'+count+' із 2 пройдено</span></section>';}).join("")||'<p class="muted">Такої теми немає.</p>';}
function variant(m,type,label){var done=state.done[m.id+"-"+type];return '<button type="button" class="variant '+(done?"done":"")+'" data-action="unit" data-id="'+m.id+'" data-type="'+type+'">'+h(label)+'<span>'+(done?"✓ Пройдено":"○ Ще не пройдено")+"</span></button>";}
function readingKey(m,i){return m.id+"-q"+i;}
function gapKey(m,i){return m.id+"-g"+i;}
function score(m,type){var list=type==="reading"?m.questions:m.gaps;return list.reduce(function(n,q,i){return n+(state.answers[type==="reading"?readingKey(m,i):gapKey(m,i)]===(type==="reading"?q[2]:q.answer)?1:0);},0);}
function lesson(){var m=moduleById(current.id);if(!m)return '<p>Тему не знайдено.</p>';var type=current.type||"reading",good=score(m,type),done=state.done[m.id+"-"+type];
var head=btn("‹ Усі теми","course","ghost back")+'<div class="eyebrow">'+h(m.deTitle)+'</div><h1>'+h(m.title)+'</h1><p class="muted">'+h(m.goal)+'</p><div class="tabs">'+btn("1. Ситуація й діалог","unit",type==="reading"?"active":"",'data-id="'+m.id+'" data-type="reading"')+btn("2. Пропуски","unit",type==="gaps"?"active":"",'data-id="'+m.id+'" data-type="gaps"')+'</div><div class="row between"><span class="tag">Натисни німецьке слово → переклад українською</span><span class="unit-score">'+good+'/3 правильні '+(done?"· ✓ Пройдено":"")+'</span></div><div class="space"></div>';
if(type==="gaps")return head+'<section class="card"><h2>Вибирай відповідь прямо в тексті</h2><p class="muted small">Натисни номер пропуску. Пояснення з’явиться одразу після вибору.</p><div class="german" lang="de" data-context="'+h(m.gapText.replace(/\{\{\d+\}\}/g,"…"))+'">'+gapMarkup(m)+'</div><div class="row">'+btn("▷ Правильний зразок","speak-gap","","data-id=\""+m.id+"\"")+'</div><p class="callout">Озвучення читає правильний зразок. Слухай його після власної спроби.</p></section><div class="space"></div>'+m.gaps.map(function(g,i){var answer=state.answers[gapKey(m,i)];if(answer===undefined)return "";return '<div class="feedback '+(answer===g.answer?"good":"bad")+'"><strong>'+g.n+": "+h(g.options[answer])+" · "+(answer===g.answer?"Правильно":"Поки неправильно")+'</strong><br>'+h(g.why[answer])+'<br><span class="small">'+h(g.rule)+"</span></div>";}).join("")+completion(m,type,good);
return head+'<div class="lesson-columns"><div class="stack"><section class="card"><div class="row between"><h2>Ситуація</h2>'+btn("▷ Слухати","speak-reading","","data-id=\""+m.id+"\"")+'</div>'+de(m.reading,m.keys)+(state.settings.translation?'<details><summary class="accent">Переклад усього тексту</summary><p class="translation">'+h(m.translation)+"</p></details>":"")+'</section><section class="card"><h2>Перевір розуміння</h2>'+m.questions.map(function(q,i){return questionMarkup(m,q,i);}).join("")+'</section>'+completion(m,type,good)+'</div><div class="stack"><section class="card"><div class="row between"><h2>Діалог уголос</h2>'+btn("▷ Увесь діалог","speak-dialogue","","data-id=\""+m.id+"\"")+'</div>'+m.dialogue.map(function(d,i){return '<div class="dialogue-line"><div class="row between"><span class="speaker">'+h(d[0])+'</span>'+btn("▷","speak-line","icon",'aria-label="Слухати репліку '+(i+1)+'" data-id="'+m.id+'" data-index="'+i+'"')+'</div>'+de(d[1])+(state.settings.translation?'<p class="translation">'+h(d[2])+"</p>":"")+"</div>";}).join("")+'<div class="hint">'+h(m.talk)+'</div></section><section class="card"><h2>Фрази для практики</h2>'+m.phrases.map(function(p,i){return '<div class="phrase">'+de(p[0])+(state.settings.translation?'<p class="translation">'+h(p[1])+"</p>":"")+"</div>";}).join("")+'</section><section class="card"><h2>Твій короткий запис</h2><p class="muted small">'+h(m.writingPrompt)+'</p><textarea data-note="'+m.id+'" placeholder="Напиши німецькою…" aria-label="Твоя письмова відповідь">'+h(state.notes[m.id]||"")+'</textarea><p class="tag">Зберігається на цьому пристрої. Автоматична оцінка письма не виконується.</p><details><summary class="accent">Показати зразок</summary>'+de(m.model)+'<p class="translation">'+h(m.modelUA)+'</p>'+btn("▷ Слухати зразок","speak-model","","data-id=\""+m.id+"\"")+'</details></section></div></div>';}
function questionMarkup(m,q,i){var key=readingKey(m,i),a=state.answers[key];return '<div class="question"><strong>'+(i+1)+". "+h(q[0])+'</strong><div class="space"></div><div class="answers">'+q[1].map(function(o,j){var cls=a===j?(j===q[2]?"correct":"wrong"):"";return '<button type="button" class="option '+cls+'" data-action="answer" data-id="'+m.id+'" data-index="'+i+'" data-option="'+j+'"><span class="letter">'+String.fromCharCode(97+j)+'</span><span lang="de">'+h(o)+"</span></button>";}).join("")+'</div>'+(a===undefined?"":'<div class="feedback '+(a===q[2]?"good":"bad")+'"><strong>'+(a===q[2]?"✓ Правильно":"Спробуй ще раз")+'</strong><br>'+h(q[3])+"</div>")+"</div>";}
function gapMarkup(m){return m.gapText.split(/(\{\{\d+\}\})/g).map(function(part){var found=part.match(/^\{\{(\d+)\}\}$/);if(!found)return rich(part,m.keys);var n=Number(found[1]),i=m.gaps.findIndex(function(g){return g.n===n;}),g=m.gaps[i],a=state.answers[gapKey(m,i)];return '<button type="button" class="gap '+(a===undefined?"":a===g.answer?"correct":"wrong")+'" data-action="gap" data-id="'+m.id+'" data-index="'+i+'">'+n+(a===undefined?"":": "+h(g.options[a]))+"</button>";}).join("");}
function completion(m,type,good){var done=state.done[m.id+"-"+type];return '<div class="footer-actions row">'+btn(done?"✓ Підпункт пройдено":good===3?"Завершити підпункт ✓":"Дай 3 правильні відповіді","complete",good===3?"primary":"",'data-id="'+m.id+'" data-type="'+type+'" '+(good<3?"disabled":""))+btn("Повторити вправу","retry","ghost",'data-id="'+m.id+'" data-type="'+type+'"')+"</div>";}
function modal(html){var el=document.getElementById("modal");document.getElementById("modal-content").innerHTML=html;if(!el.open)el.showModal();}
function modalHead(title){return '<div class="modal-top"><h2>'+h(title)+'</h2>'+btn("×","close-modal","icon",'aria-label="Закрити"')+"</div>";}
function openGap(id,i){var m=moduleById(id),g=m.gaps[i],a=state.answers[gapKey(m,i)];modal(modalHead("Пропуск "+g.n)+'<p class="muted small">Обери слово або вираз</p><div class="answers">'+g.options.map(function(o,j){return '<button type="button" class="option '+(a===j?(j===g.answer?"correct":"wrong"):"")+'" data-action="gap-answer" data-id="'+id+'" data-index="'+i+'" data-option="'+j+'"><span class="letter">'+String.fromCharCode(97+j)+'</span><span lang="de">'+h(o)+"</span></button>";}).join("")+'</div>'+(a===undefined?"":'<div class="feedback '+(a===g.answer?"good":"bad")+'" role="status"><strong>'+(a===g.answer?"✓ Правильно":"Поки неправильно")+'</strong><br>'+h(g.why[a])+'<br><strong>'+h(g.rule)+"</strong></div>")+'<div class="space"></div>'+btn("Повернутися до тексту","close-modal","wide"));}

ю мовні моделі…")+'</p><div class="row">'+btn("Завантажити через Wi-Fi","download-model","primary")+btn("Через мобільну мережу","download-model-mobile")+'</div><div class="space"></div>'+btn("Налаштувати німецький голос","tts-settings"):'<p class="small muted">Довільний машинний переклад і PDF-OCR доступні в Android-версії. На Windows працюють словник курсу та власні переклади. Додаткові власні фрази озвучує локальний німецький голос у системі; голос курсу вже вбудований.</p>')+'<div class="space"></div>'+btn("Перевірити озвучення","test-speech")+btn("Зупинити голос","stop-speech","ghost")+'</section><div class="space"></div><section class="card"><h2>Твій прогрес</h2><p class="muted small">Підтримуються резервні копії версії 1.0. У старій програмі натисни «Експорт резервної копії», а тут — «Імпорт резервної копії». Переносяться відповіді, пройдені уроки, картки, нотатки та імпортовані тексти. На Windows експортуй копію перед перенесенням програми в іншу папку.</p><div class="row">'+btn("Експорт резервної копії","export","primary")+btn("Імпорт резервної копії","import")+'</div><p class="tag">Імпорт замінює поточний прогрес після підтвердження. Автоматичної синхронізації між пристроями немає.</p></section>';}
function materials(){return btn("Офіційні матеріали й план Ausbildung 2027","ausbildung","wide")+'<div class="space"></div>'+'<div class="eyebrow">Джерела та твої документи</div><h1>Матеріали</h1><section class="card"><h2>Мої PDF й тексти</h2><p class="muted small">'+(native()?"На телефоні PDF-сторінки розпізнаються локально. Скани можуть містити помилки: звіряй важливі слова з оригіналом. Великі книги обробляються посторінково.":"На Windows можна імпортувати TXT. PDF-скани розпізнаються в Android-версії; потім перенеси їхні тексти з резервною копією.")+'</p><div class="row">'+(native()?btn("＋ Імпортувати PDF","import-pdf","primary"):"")+btn("＋ Імпортувати TXT","import-text")+'</div><div id="ocr-status" class="callout">'+h(importing?importing.name+" · "+importing.page+" / "+importing.total+" сторінок":"")+'</div>'+(importing?btn("Зупинити розпізнавання","cancel-ocr","bad"):"")+'<div class="space"></div>'+books.map(function(b){return '<div class="row between source"><div><strong>'+h(b.name)+'</strong><div class="tag">'+(b.pages||[]).length+' сторінок · '+(b.partial?"частково":"готово")+'</div></div>'+btn("Читати","open-book","","data-id=\""+h(b.id)+"\"")+"</div>";}).join("")+'</section><div class="space"></div><section class="card"><h2>Що використано з твоїх PDF</h2><p class="muted small">Доступний текстовий шар 7 PDF витягнуто (2068 сторінок). Три скани ще не розпізнано в цій збірці. Це не означає, що кожна сторінка книжок є окремим уроком. Уроки — відібрана авторська адаптація для Altenheim.</p>'+DATA.sources.map(function(s){return '<div class="source"><div class="row between"><h3>'+h(s.title)+'</h3><span class="pill">'+(s.status==="text"?"Текст витягнуто":"Потрібне OCR")+'</span></div><p class="muted">'+s.pages+' сторінок</p><p>'+h(s.use)+'</p><p class="muted">'+h(s.selected)+"</p></div>";}).join("")+'<p class="callout">Клінічні книжки використано для мовної лексики. Програма не призначає лікування й не замінює практичного навчання.</p></section>';}

var dbPromise=null;
function db(){if(!window.indexedDB)return Promise.reject(new Error("IndexedDB недоступна"));if(!dbPromise)dbPromise=new Promise(function(resolve,reject){var r=indexedDB.open("sviat-pflege-books",1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("books"))r.result.createObjectStore("books",{keyPath:"id"});};r.onsuccess=function(){resolve(r.result);};r.onerror=function(){reject(r.error);};});return dbPromise;}

if(a==="add-word"&&currentWord&&currentWord.ua){addCard(currentWord.word,currentWord.ua,currentWord.context);return;}
if(a==="save-word"){var input=document.getElementById("custom-translation");if(input&&input.value.trim()&&currentWord){state.dictionary[currentWord.word.toLowerCase()]=input.value.trim();currentWord.ua=input.value.trim();save();wordModal();}return;}
if(a==="new-card"){modal(modalHead("Власна картка")+'<label>Німецькою<input id="new-de" type="text" class="search" placeholder="die Unterstützung"></label><label>Українською<input id="new-ua" type="text" class="search" placeholder="допомога; підтримка"></label>'+btn("Додати картку","save-card","primary wide"));return;}
if(a==="save-card"){addCard(document.getElementById("new-de").value,document.getElementById("new-ua").value);document.getElementById("modal").close();render();return;}
if(a==="speak-card"){var card=currentCard();if(card)speak(card.de);return;}
if(a==="speak-reading"){speak(moduleById(id).reading);return;}if(a==="speak-dialogue"){speak(moduleById(id).dialogue.map(function(d){return d[1];}).join(" … "));return;}
if(a==="speak-line"){speak(moduleById(id).dialogue[i][1]);return;}if(a==="speak-model"){speak(moduleById(id).model);return;}
if(a==="speak-gap"){var gm=moduleById(id);speak(gm.gapText.replace(/\{\{(\d+)\}\}/g,function(_,n){var gi=gm.gaps.findIndex(function(g){return g.n===Number(n);});return gm.gaps[gi].options[gm.gaps[gi].answer];}));return;}
if(a==="test-speech"){speak("Guten Morgen. Wobei brauchen Sie Unterstützung?");return;}if(a==="stop-speech"){stopSpeech();return;}
if(a==="download-model"){downloadModel(false);return;}if(a==="download-model-mobile"){downloadModel(true);return;}if(a==="tts-settings"&&native()){window.Native.openTtsSettings();return;}

if(a==="import-text"){document.getElementById("text-file").click();return;}if(a==="open-book"){go("book",id);return;}

document.addEventListener("input",function(e){var t=e.target;if(t.id==="course-search"){document.getElementById("course-list").innerHTML=courseRows(t.value);return;}if(t.dataset.note){state.notes[t.dataset.note]=t.value;save();}if(t.dataset.cardNote){var r=state.reviews[t.dataset.cardNote]||{};r.note=t.value;state.reviews[t.dataset.cardNote]=r;save();}});
document.addEventListener("change",function(e){var t=e.target,rerender=false;if(t.id==="theme-setting"){state.settings.theme=t.value;rerender=true;}if(t.id==="font-setting"){state.settings.font=Number(t.value);rerender=true;}if(t.id==="rate-setting"){state.settings.rate=Number(t.value);rerender=true;}if(t.id==="highlight-setting"){state.settings.highlights=t.checked;rerender=true;}if(t.id==="translation-setting"){state.settings.translation=t.checked;rerender=true;}if(rerender){save();render();}});
document.addEventListener("keydown",function(e){if(!flash||document.getElementById("modal").open||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==="Space"){e.preventDefault();flash.revealed=!flash.revealed;render();}else if(["1","2","3"].indexOf(e.key)>=0)rateCard({1:"again",2:"hard",3:"know"}[e.key]);});
document.getElementById("modal").addEventListener("click",function(e){if(e.target===e.currentTarget)e.currentTarget.close();});
document.getElementById("backup-file").addEventListener("change",async function(){if(this.files[0]){if(this.files[0].size>20000000){toast("Резервна копія завелика: максимум 20 МБ.");return;}await importBackup(await this.files[0].text());this.value="";}});
document.getElementById("text-file").addEventListener("change",async function(){var f=this.files[0];if(!f)return;if(f.size>10000000){toast("Текст завеликий: максимум 10 МБ.");return;}var text=await f.text(),id="book-"+Date.now(),pages=text.split("\f").flatMap(function(p){var a=[];for(var j=0;j<p.length;j+=12000)a.push(p.slice(j,j+12000));return a;});try{await saveBook({id:id,name:f.name,pages:pages,partial:false});await loadBooks();go("book",id);}catch(e){toast("Не вдалося зберегти текст.");}this.value="";});
window.PflegeApp={back:function(){var modalEl=document.getElementById("modal");if(modalEl.open){modalEl.close();return;}if(current.page==="home"){if(native())window.Native.closeApp();return;}flash=null;go(current.page==="lesson"||current.page==="matching"||current.page==="ausbildung"||current.page==="exam-menu"||current.page==="exam-case"?"course":"home");},data:DATA,getState:function(){return state;},getBooks:function(){return books;},getAudioState:function(){return activeAudio?{src:activeAudio.src,paused:activeAudio.paused,error:activeAudio.error?activeAudio.error.code:null}:null;},render:render,go:go,importProgress:importBackup,nativeMessage:toast,modelStatus:function(message){window.PflegeModelStatus=message;var el=document.getElementById("model-status");if(el)el.textContent=message;},translation:function(word,text,error){if(!currentWord||currentWord.word!==word)return;if(error){wordModal(error);return;}currentWord.ua=text;state.dictionary[word.toLowerCase()]=text;save();wordModal();},ocrStart:function(meta){importing={id:meta.id,name:meta.name,page:0,total:meta.total};var b={id:meta.id,name:meta.name,pages:[],partial:true};books.push(b);if(current.page==="materials")render();},ocrPage:function(meta){var b=books.find(function(x){return x.id===meta.id;});if(!b)return;b.pages[meta.page-1]=meta.text;importing={id:b.id,name:b.name,page:meta.page,total:meta.total};saveBook(b).catch(function(){toast("Не вистачає місця для збереження OCR.");});var el=document.getElementById("ocr-status");if(el)el.textContent=b.name+" · "+meta.page+" / "+meta.total+" сторінок";},ocrDone:function(meta){var b=books.find(function(x){return x.id===meta.id;});if(b){b.partial=!!meta.partial;saveBook(b).catch(function(){toast("Не вдалося зберегти документ.");});}importing=null;if(current.page==="materials")render();toast(meta.error||"Розпізнавання PDF завершено.");}};
applyTheme();render();loadBooks().then(function(){if(current.page==="materials")render();}).catch(function(){});
if(window.matchMedia){var mq=matchMedia("(prefers-color-scheme: light)");if(mq.addEventListener)mq.addEventListener("change",function(){if(state.settings.theme==="system")applyTheme();});}
if(native())setTimeout(function(){window.Native.checkModels();},300);
})();
